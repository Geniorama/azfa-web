name: Deploy to EC2

# Despliegue de azfa-web a AWS EC2 con el bundle standalone de Next.js.
# El build corre en el runner de GitHub Actions (RAM de sobra) y a la EC2 solo
# le llega el artefacto ya compilado: la instancia nunca ejecuta `next build`.

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña Actions

# Evita despliegues solapados: si llega otro push, espera a que termine el
# actual (no lo cancela, para no dejar una release a medio aplicar).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) BUILD — compila y arma el bundle standalone
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Recrea .env.prod SOLO con las variables necesarias en tiempo de build:
      #  - NEXT_PUBLIC_*: se inlinean dentro del bundle JS al compilar.
      #  - STRAPI_URL: se usa para hacer fetch al CMS durante el prerender.
      # Ninguna es sensible (las públicas viajan al navegador; STRAPI_URL es una
      # URL). Los secretos de servidor (RECAPTCHA_SECRET_KEY, REVALIDATION_SECRET,
      # STRAPI_WEBHOOK_SECRET) NO van aquí: solo se usan en runtime y viven
      # exclusivamente en la EC2 (shared/.env.production).
      - name: Generar .env.prod para el build
        run: |
          cat > .env.prod <<EOF
          NEXT_PUBLIC_STRAPI_URL=${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
          STRAPI_URL=${{ secrets.STRAPI_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_TRANSLATE_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_TRANSLATE_API_KEY }}
          NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}
          EOF

      - name: Build (standalone)
        run: npm run build:prod

      # `output: "standalone"` NO copia .next/static ni public: hay que
      # ensamblarlos manualmente junto al server.js.
      - name: Ensamblar bundle standalone
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          # PM2 config viaja dentro del bundle (se ejecuta desde la release).
          cp ecosystem.config.js deploy/ecosystem.config.js

      - name: Empaquetar tarball
        run: tar -czf azfa-web.tar.gz -C deploy .

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: azfa-web.tar.gz
          retention-days: 5

  # ---------------------------------------------------------------------------
  # 2) DEPLOY — envía el bundle a la EC2 y activa la nueva release
  # ---------------------------------------------------------------------------
  # Desactivado hasta que la EC2 esté lista: solo corre cuando la variable de
  # repo DEPLOY_ENABLED == 'true' (Settings → Secrets and variables → Actions →
  # Variables). Mientras tanto solo se ejecuta el job `build` (probar el build).
  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir bundle
        run: |
          scp -i ~/.ssh/id_deploy azfa-web.tar.gz \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/azfa-web.tar.gz"

      - name: Publicar release y recargar PM2
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          APP_DIR=/var/www/azfa-web
          REL="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"

          # 1. Desempaquetar la nueva release
          mkdir -p "$REL"
          tar -xzf /tmp/azfa-web.tar.gz -C "$REL"
          rm -f /tmp/azfa-web.tar.gz

          # 2. Cargar el env de runtime persistente del servidor
          #    (creado una sola vez en $APP_DIR/shared/.env.production;
          #    NO lo pisa el deploy). Contiene las vars de servidor.
          set -a
          . "$APP_DIR/shared/.env.production"
          set +a

          # 2b. Caché de imágenes optimizadas PERSISTENTE entre releases.
          #     Next escribe las variantes AVIF/WebP en <distDir>/cache/images
          #     (image-optimizer.js: join(distDir,'cache','images')). Como cada
          #     release es un directorio nuevo, esa caché nacía VACÍA en cada
          #     deploy y el t3.micro tenía que reoptimizar todo: medido, un MISS
          #     cuesta 0,9 s (w=1200) a 2,1 s (w=3840) por imagen, frente a
          #     ~0,25 s en HIT — con ~190 imágenes en el home eso satura los
          #     créditos de CPU de la instancia durante horas tras cada deploy.
          #     Enlazando el directorio a shared/ la caché sobrevive.
          #     Solo se comparte `images` (contenido inmutable: los ficheros del
          #     CMS llevan hash en el nombre). El resto de .next/cache —ISR,
          #     fetch-cache— se deja por release a propósito: pertenece a esa
          #     build concreta y compartirlo serviría HTML viejo.
          mkdir -p "$APP_DIR/shared/next-image-cache"
          mkdir -p "$REL/.next/cache"
          rm -rf "$REL/.next/cache/images"
          ln -sfn "$APP_DIR/shared/next-image-cache" "$REL/.next/cache/images"

          # 3. Activar la release (symlink atómico) y arrancar/recargar
          ln -sfn "$REL" "$APP_DIR/current"
          cd "$APP_DIR/current"

          # PM2 fija `pm_exec_path` al crear el proceso, resolviendo el symlink
          # a la ruta FÍSICA de la release. `startOrReload` sobre un proceso ya
          # existente reutiliza esa ruta y NO la reapunta a la release nueva:
          # el sitio se quedó sirviendo la primera release del 16 jul mientras
          # los deploys posteriores parecían correctos (release desempaquetada,
          # symlink movido, workflow en verde). Recrear el proceso es la única
          # forma fiable de que tome la release nueva; cuesta ~2 s de corte.
          pm2 delete azfa-web >/dev/null 2>&1 || true
          pm2 start ecosystem.config.js --update-env
          pm2 save

          # Fallar el deploy si el proceso no quedó apuntando a esta release
          # (antes esto pasaba en silencio).
          sleep 3
          # `|| true`: con `set -e` un grep sin coincidencias abortaría aquí y
          # se perdería el mensaje de diagnóstico del `case`.
          RUNNING=$(pm2 jlist | tr ',' '\n' | grep -m1 pm_exec_path | cut -d'"' -f4 || true)
          # `pm_exec_path` es ahora `…/current/server.js` (el symlink), porque
          # ecosystem.config.js usa `cwd: /var/www/azfa-web/current`. Hay que
          # RESOLVERLO antes de comparar contra la ruta física de la release.
          RUNNING_REAL=$(readlink -f "$RUNNING" 2>/dev/null || echo "$RUNNING")
          case "$RUNNING_REAL" in
            "$REL"/*) echo "PM2 sirviendo la release nueva: $RUNNING_REAL" ;;
            *) echo "ERROR: PM2 sirve '$RUNNING_REAL', se esperaba algo en '$REL'"; exit 1 ;;
          esac

          # 4. Regenerar el contenido ISR con datos frescos del CMS.
          #    El prerender del build puede venir incompleto: los fetch al CMS
          #    desde el runner de GitHub a veces fallan (Cloudflare desafía IPs
          #    de datacenter). El servidor sí llega bien al CMS, así que una
          #    revalidación total tras el deploy garantiza contenido correcto.
          sleep 5
          curl -s -X POST http://127.0.0.1:3000/api/revalidate \
            -H "Authorization: Bearer $REVALIDATION_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"revalidateAll": true}' \
            && echo "Revalidación total disparada" \
            || echo "AVISO: fallo al revalidar (la app revalida sola por TTL)"

          # 5. Conservar solo las últimas 5 releases (rollback rápido).
          #    NUNCA borrar la release que el proceso está ejecutando: cuando
          #    PM2 se quedó clavado en una release antigua, esa release llegó a
          #    ser la 5.ª más reciente y la siguiente poda habría borrado en
          #    caliente los ficheros del proceso vivo. El filtro es barato y
          #    convierte ese fallo en inocuo.
          #    Se resuelve el symlink (`pm_exec_path` apunta a `current/`) para
          #    obtener la release FÍSICA en uso y poder compararla.
          RUNNING_REL=$(readlink -f "$RUNNING" 2>/dev/null | xargs -r dirname || true)
          ls -1dt "$APP_DIR"/releases/*/ | tail -n +6 | while read -r old; do
            if [ "${old%/}" = "$RUNNING_REL" ]; then
              echo "AVISO: se omite la poda de $old — es la release en ejecución"
            else
              rm -rf "$old"
            fi
          done

          echo "Release activa: $REL"
          ENDSSH
